<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PREVIEW · Premier Builders KPI Scorecard</title>
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff; --border: #e4e3de; --grid: #ecebe7; --hover: #f2f1ed;
    --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #75746f;
    --series: #2a78d6; --link: #1c5cab; --prev: #c2620f;
    --good-ink: #006300; --bad-ink: #b02a2a; --warn-ink: #8a5a00;
    --chip-good: #e6f5e6; --chip-bad: #fbeaea; --chip-warn: #fdf3dc; --chip-none: #f0efec;
    --shadow: 0 12px 40px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0d0d0d; --surface: #1a1a19; --raised: #222221; --border: #2e2e2c; --grid: #2a2a28; --hover: #262624;
      --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #9a998f;
      --series: #3987e5; --link: #86b6ef; --prev: #d27028;
      --good-ink: #5fd35f; --bad-ink: #f08a8a; --warn-ink: #f5c35a;
      --chip-good: #13301a; --chip-bad: #3a1a1a; --chip-warn: #3a2e12; --chip-none: #2a2a28;
      --shadow: 0 12px 40px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --page: #0d0d0d; --surface: #1a1a19; --raised: #222221; --border: #2e2e2c; --grid: #2a2a28; --hover: #262624;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #9a998f;
    --series: #3987e5; --link: #86b6ef; --prev: #d27028;
    --good-ink: #5fd35f; --bad-ink: #f08a8a; --warn-ink: #f5c35a;
    --chip-good: #13301a; --chip-bad: #3a1a1a; --chip-warn: #3a2e12; --chip-none: #2a2a28;
    --shadow: 0 12px 40px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 8px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; position: relative; }
  .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 7px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--series); border-color: var(--series); color: #fff; }
  .btn[disabled] { opacity: .6; cursor: default; }
  .btn svg { width: 15px; height: 15px; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pop { position: absolute; top: calc(100% + 6px); right: 0; z-index: 20; background: var(--raised); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; width: 300px; display: none; }
  .pop.open { display: block; }
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .presets button { text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .presets button:hover { background: var(--hover); }
  .presets button[aria-pressed="true"] { background: var(--series); color: #fff; }
  .custom { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; display: grid; gap: 8px; }
  .custom label { font-size: 12px; color: var(--ink-2); display: grid; gap: 3px; }
  .custom input { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; }
  .hint { font-size: 12px; color: var(--ink-3); }
  .status-line { font-size: 12px; color: var(--ink-2); min-height: 18px; margin: 6px 0 4px; }
  .row { margin-top: 20px; }
  .row h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin: 0 0 8px; font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px) { .tiles { grid-template-columns: 1fr; } }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 12px; min-height: 128px; display: flex; flex-direction: column; text-align: left; width: 100%; }
  button.tile { cursor: pointer; }
  button.tile:hover { border-color: var(--series); }
  button.tile:focus-visible { outline: 2px solid var(--series); outline-offset: 2px; }
  .tile .label { font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .tile .value { font-size: 34px; font-weight: 650; letter-spacing: -0.02em; margin: 6px 0 8px; font-variant-numeric: tabular-nums; }
  .tile .value.muted { color: var(--ink-3); }
  .tile .foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--ink-2); }
  .tile .view { margin-left: auto; color: var(--link); font-weight: 600; opacity: .85; }
  button.tile:hover .view { opacity: 1; text-decoration: underline; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-weight: 600; font-size: 12px; white-space: nowrap; }
  .chip.good { background: var(--chip-good); color: var(--good-ink); }
  .chip.bad { background: var(--chip-bad); color: var(--bad-ink); }
  .chip.warn { background: var(--chip-warn); color: var(--warn-ink); }
  .chip.none { background: var(--chip-none); color: var(--ink-2); font-weight: 500; }
  .panels { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; }
  @media (max-width: 900px) { .panels { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .panel h3 { margin: 0 0 12px; font-size: 14px; }
  .bars { display: grid; gap: 4px; }
  .bar { display: grid; grid-template-columns: 120px 1fr 92px; gap: 10px; align-items: center; font-size: 13px; background: none; border: 0; padding: 3px 4px; border-radius: 6px; text-align: left; width: 100%; }
  button.bar { cursor: pointer; }
  button.bar:hover { background: var(--hover); }
  .bar .name { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { height: 18px; }
  .bar .fill { height: 100%; background: var(--series); border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar .num { text-align: right; font-variant-numeric: tabular-nums; }
  .bar .num span { color: var(--ink-3); margin-left: 6px; }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; padding: 6px 9px; border-radius: 6px; opacity: 0; transition: opacity .1s; z-index: 40; max-width: 280px; }
  .notes { margin-top: 20px; font-size: 12px; color: var(--ink-3); }
  .err { background: var(--chip-bad); color: var(--bad-ink); padding: 12px 14px; border-radius: 10px; margin-top: 16px; }
  /* modal */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: none; align-items: flex-start; justify-content: center; padding: 4vh 12px; overflow: auto; }
  .scrim.open { display: flex; }
  .modal { background: var(--raised); border-radius: 14px; box-shadow: var(--shadow); width: min(1180px, 100%); padding: 18px 18px 14px; }
  .modal.small { width: min(420px, 100%); }
  .mhead { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
  .mhead h3 { margin: 0; font-size: 18px; }
  .mhead .def { color: var(--ink-2); font-size: 13px; margin-top: 4px; max-width: 760px; }
  .close { background: none; border: 0; font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink-2); padding: 2px 6px; border-radius: 6px; }
  .close:hover { background: var(--hover); }
  .summary { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 12px 0; font-size: 13px; }
  .summary b { font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .toolbar input[type=search], .toolbar select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  .toolbar input[type=search] { min-width: 220px; flex: 1 1 220px; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--surface); font-size: 12px; color: var(--ink-2); font-weight: 600; cursor: pointer; user-select: none; }
  th[aria-sort] .arr { opacity: 1; }
  th .arr { opacity: .3; margin-left: 4px; font-size: 10px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }
  tr:hover td { background: var(--hover); }
  tbody tr:last-child td { border-bottom: 0; }
  .empty { padding: 28px; text-align: center; color: var(--ink-3); }
  .pager { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; color: var(--ink-2); gap: 8px; flex-wrap: wrap; }
  .pwfield { display: grid; gap: 6px; margin: 14px 0 8px; }
  .pwfield input[type=password] { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; }
  .muted { color: var(--ink-3); }
  /* section accents: thin colored bar beside each heading, neutral hairline after it */
  :root { --sec-1: #2066bd; --sec-2: #6352c9; --sec-3: #b84a1b; --sec-4: #1b7a33; --sec-5: #0f7378; --sec-6: #8f5f00; --sec-7: #b0306a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sec-1: #4a94ec; --sec-2: #9a8ff0; --sec-3: #ef7a45; --sec-4: #3cba62; --sec-5: #2bb5ba; --sec-6: #e5ad2e; --sec-7: #f0709f; } }
  :root[data-theme="dark"] { --sec-1: #4a94ec; --sec-2: #9a8ff0; --sec-3: #ef7a45; --sec-4: #3cba62; --sec-5: #2bb5ba; --sec-6: #e5ad2e; --sec-7: #f0709f; }
  .row { margin-top: 28px; }
  .row h2 { display: flex; align-items: center; gap: 10px; color: var(--ink); font-size: 12px; margin-bottom: 10px; }
  .row h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--sec, var(--ink-3)); flex: none; }
  .row h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, color-mix(in srgb, var(--sec, var(--border)) 45%, transparent), var(--border) 30%, transparent); }
  .row h2 .num { color: var(--sec); font-variant-numeric: tabular-nums; }
  .sec-1 { --sec: var(--sec-1); } .sec-2 { --sec: var(--sec-2); } .sec-3 { --sec: var(--sec-3); }
  .sec-4 { --sec: var(--sec-4); } .sec-5 { --sec: var(--sec-5); } .sec-6 { --sec: var(--sec-6); } .sec-7 { --sec: var(--sec-7); }
  /* executive summary */
  .exec { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .exec h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin: 0 0 10px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .exec h2 .muted { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .exec-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 900px) { .exec-cols { grid-template-columns: 1fr; gap: 10px; } }
  .exec h4 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .exec h4 .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.good { background: #0ca30c; } .dot.bad { background: #d03b3b; } .dot.focus { background: var(--series); }
  .exec ul { margin: 0; padding-left: 16px; display: grid; gap: 5px; font-size: 13px; color: var(--ink); }
  .exec li::marker { color: var(--ink-3); }
  .exec .lnk { display: inline; background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; text-align: left; font: inherit; }
  .exec .lnk:hover { text-decoration: underline; }
  .exec .none { color: var(--ink-3); font-size: 13px; }
  /* Voice AI */
  .tiles + .tiles { margin-top: 12px; }
  .vsum { margin-top: 12px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-left: 4px solid var(--sec); }
  .vsum h3 { margin: 0 0 4px; font-size: 13px; color: var(--ink-2); }
  .vsum p { margin: 0; font-size: 14px; line-height: 1.5; max-width: 760px; }
  .vsum .lnk { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; font: inherit; font-weight: 600; }
  .vsum .lnk:hover { text-decoration: underline; }
  .vnote { margin-top: 8px; font-size: 12px; color: var(--ink-3); }
  .tile .hint2 { font-size: 12px; color: var(--ink-3); line-height: 1.35; }
  /* ---------- period comparison ---------- */
  .btn.on { border-color: var(--series); box-shadow: inset 0 0 0 1px var(--series); }
  .pop.cmp-pop { width: 340px; max-width: calc(100vw - 32px); }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .switch input { width: 34px; height: 18px; accent-color: var(--series); }
  .cmp-presets { display: grid; gap: 4px; }
  .cmp-presets button { text-align: left; background: none; border: 1px solid transparent; padding: 7px 9px; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
  .cmp-presets button:hover:not([disabled]) { background: var(--hover); }
  .cmp-presets button[aria-pressed="true"] { border-color: var(--series); background: var(--hover); font-weight: 600; }
  .cmp-presets button[disabled] { opacity: .55; cursor: default; }
  .cmp-presets .lock { font-size: 11px; color: var(--ink-3); font-weight: 400; }
  .cmp-match { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--ink-2); margin: 10px 0 0; }
  .cmp-dates { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cmp-dates .per { grid-column: 1 / -1; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .cmp-dates label { font-size: 12px; color: var(--ink-2); display: grid; gap: 3px; }
  .cmp-dates input { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 6px 6px; min-width: 0; }
  .cmp-dates .btn { grid-column: 1 / -1; justify-content: center; }
  .sw { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--series); vertical-align: middle; }
  .sw.prev { border-top: 2px dashed var(--prev); }
  .cmp-line { font-size: 12px; color: var(--ink-2); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .cmp-line b { color: var(--ink); font-weight: 600; }
  .cmp-line .off { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; font-size: 12px; }
  .tile .cmpbox { margin-top: auto; display: grid; gap: 3px; font-size: 12px; color: var(--ink-2); }
  .tile .cmpbox .pv { display: flex; justify-content: space-between; gap: 8px; }
  .tile .cmpbox .pv b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .cmpbox .chg { font-weight: 600; font-variant-numeric: tabular-nums; }
  .chg.good { color: var(--good-ink); } .chg.bad { color: var(--bad-ink); } .chg.flat, .chg.neutral { color: var(--ink-2); } .chg.none { color: var(--ink-3); font-weight: 500; }
  .tile.cmp .foot { margin-top: 6px; }
  .cmpsum { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .cmpsum h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin: 0 0 10px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .cmpsum h2 .muted { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .kstrip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
  @media (max-width: 900px) { .kstrip { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 480px) { .kstrip { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kstrip button { text-align: left; background: var(--page); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
  .kstrip button:hover { border-color: var(--series); }
  .kstrip .kl { font-size: 11px; color: var(--ink-2); font-weight: 600; }
  .kstrip .kv { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .kstrip .kp { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .kstrip .chg { font-size: 12px; }
  .cmpsum ul { margin: 0; padding-left: 16px; display: grid; gap: 5px; font-size: 13px; }
  .cmpsum li::marker { color: var(--ink-3); }
  .cmpsum h4 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .cmpsum h4 .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .cmpsum .lnk { display: inline; background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; text-align: left; font: inherit; }
  .cmpsum .lnk:hover { text-decoration: underline; }
  .cmpsum .none { color: var(--ink-3); font-size: 13px; }
  .cmpsum .caveat { margin-top: 10px; font-size: 12px; color: var(--ink-3); }
  .trend { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .trend .thead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .trend h3 { margin: 0; font-size: 14px; }
  .trend select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chartwrap { position: relative; }
  .chartwrap svg { display: block; width: 100%; height: 240px; }
  .chartwrap .ax { font-size: 11px; fill: var(--ink-3); }
  .chartwrap .grid { stroke: var(--grid); stroke-width: 1; }
  .chartwrap .base { stroke: var(--border); stroke-width: 1; }
  .ctip { position: absolute; pointer-events: none; background: var(--raised); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 180px; opacity: 0; transition: opacity .08s; z-index: 5; }
  .ctip .r { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .ctip .r b { font-variant-numeric: tabular-nums; }
  .trend details { margin-top: 8px; font-size: 12px; color: var(--ink-2); }
  .trend details table { margin-top: 6px; font-size: 12px; }
  .trend details td, .trend details th { padding: 4px 10px 4px 0; text-align: left; }
  .trend .msg { font-size: 13px; color: var(--ink-3); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<div style="background:#111;color:#fff;font:13px/1.4 system-ui,sans-serif;padding:8px 16px;text-align:center">
  <b style="background:#f0709f;color:#111;padding:1px 8px;border-radius:999px;margin-right:8px">PREVIEW</b>
  Period comparison feature, for review. The live dashboard is unchanged: <a href="../" style="color:#9cc3f5">open live dashboard</a>
</div>
<div class="wrap">
  <header>
    <div>
      <h1>Premier Builders · Sales KPI Scorecard</h1>
      <div class="sub" id="updated">Loading…</div>
      <div class="cmp-line" id="cmpLine" hidden></div>
    </div>
    <div class="controls">
      <button class="btn" id="rangeBtn" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span id="rangeLabel">Last 7 days</span><span aria-hidden="true">▾</span>
      </button>
      <button class="btn" id="cmpBtn" aria-haspopup="dialog" aria-expanded="false" title="Compare two periods">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>
        <span id="cmpBtnLabel">Compare</span>
      </button>
      <button class="btn" id="refreshBtn" title="Pull the latest numbers from GoHighLevel">

function goalChip(value, goal, lowerBetter, unit) {
  if (goal === undefined || goal === null) return '';
  if (value === null || value === undefined) return '<span class="chip none">Not tracked yet</span>';
  const ok = lowerBetter ? value <= goal : value >= goal;
  const g = (lowerBetter ? '≤ ' : '') + (unit === 'min' ? `${goal} min` : `${goal}%`);
  return ok ? `<span class="chip good">✓ On goal (${g})</span>` : `<span class="chip bad">! Off goal (${g})</span>`;
}
function deltaTxt(c, p, f) {
  if (c === null || c === undefined || p === null || p === undefined) return '';
  const d = c - p;
  if (d === 0) return '<span>= vs prior</span>';
  const v = f === 'pct' ? `${Math.abs(Math.round(d * 10) / 10)} pts` : fmt[f](Math.abs(d));
  return `<span>${d > 0 ? '▲' : '▼'} ${v} vs prior</span>`;
}
// ---------- period comparison helpers ----------

  const end = to - 1, o = { timeZone: TZ(), month: 'short', day: 'numeric' };

  const asOf = Math.abs(to - Date.parse((records || pub).generatedAt)) < 60000;
  return (a === b ? a : `${a} – ${b}`) + (asOf ? ' (to now)' : '');
};
const B_NAMES = {

  full: { today: 'Yesterday', thisWeek: 'Last week', thisMonth: 'Last month', thisQuarter: 'Last quarter' },

function bName() { if (!crange) return ''; if (crange.mode === 'custom') return 'Period B'; return B_NAMES[crange.mode]?.[sel.key] || 'Previous period'; }
function aName() { return cmp.on && sel.key === 'custom' ? 'Period A' : range.label; }
function bShort() { return bName().replace(/, same (point|time)$/, ''); }
const FMT_OF = { speedToLeadAvgMin: 'min', quoteValue: 'usd', revenue: 'usd', aiAvgDurationSec: 'dur', aiTotalDurationSec: 'dur' };
const fmtOf = k => FMT_OF[k] || (PCT_KEYS(k) ? 'pct' : 'n');
// One comparison rule, reused by the tiles, the summary and the chart.
function change(k, c, p) {
  if (c === null || c === undefined) return { state: 'none', text: 'No current data' };
  if (p === null || p === undefined) return { state: 'none', text: 'No previous data' };
  const d = c - p, pct = PCT_KEYS(k);
  if (Math.abs(d) < 1e-9) return { state: 'flat', d: 0, text: 'No change' };
  const dir = NEUTRAL.has(k) ? 0 : (LOWER_BETTER.has(k) ? -1 : 1) * Math.sign(d);
  const state = dir > 0 ? 'good' : dir < 0 ? 'bad' : 'neutral';
  let text = `${d > 0 ? '▲ +' : '▼ −'}${pct ? `${Math.abs(Math.round(d * 10) / 10)} pts` : fmt[fmtOf(k)](Math.abs(d))}`;
  if (!pct) text += p === 0 ? ' (new)' : ` (${d > 0 ? '+' : '−'}${Math.abs(Math.round((d / Math.abs(p)) * 1000) / 10)}%)`;

}

    tip.innerHTML = `<div style="font-weight:600;margin-bottom:4px">${esc(label)} · ${size === 7 ? 'week' : 'day'} ${i + 1}</div>
      <div class="r"><span><span class="sw"></span> ${esc(spanTxt(A[i]))}</span><b>${va[i] === null || va[i] === undefined ? '—' : esc(fmt[f](va[i]))}</b></div>
      <div class="r"><span><span class="sw prev"></span> ${esc(spanTxt(B[i]))}</span><b>${vb[i] === null || vb[i] === undefined ? '—' : esc(fmt[f](vb[i]))}</b></div>
      <div class="chg ${ch.state}" style="margin-top:4px">${esc(ch.text)}</div>`;
    const left = (x(i) / W) * r.width; tip.style.left = Math.min(Math.max(0, left + 12), r.width - 200) + 'px'; tip.style.top = '8px'; tip.style.opacity = 1;
  });
  svg.querySelector('#hit').addEventListener('mouseleave', () => { hover.style.display = 'none'; tip.style.opacity = 0; });
  $('trendTable').innerHTML = `<table><thead><tr><th>${size === 7 ? 'Week' : 'Day'}</th><th>A · ${esc(aName())}</th><th>${esc(label)}</th><th>B · ${esc(bName())}</th><th>${esc(label)}</th></tr></thead><tbody>${
    Array.from({ length: n }, (_, i) => `<tr><td>${i + 1}</td><td>${esc(spanTxt(A[i]))}</td><td>${va[i] === null || va[i] === undefined ? '—' : esc(fmt[f](va[i]))}</td><td>${esc(spanTxt(B[i]))}</td><td>${vb[i] === null || vb[i] === undefined ? '—' : esc(fmt[f](vb[i]))}</td></tr>`).join('')}</tbody></table>
    <div class="hint" style="margin-top:6px">A blank (—) means there was nothing to measure that ${size === 7 ? 'week' : 'day'} (e.g. a rate with no leads). Values use the same rules as the tiles: leads by created date, appointments by appointment date, calls by call date.</div>`;
}

// ---------- executive summary (rule-based, computed from the same numbers as the tiles) ----------
const GOALS = [
  // key, plain name, goal key, lower-is-better, drill, unit
  ['speedToLeadAvgMin', 'Speed to lead', 'speedToLeadMin', true, 'speed', 'min'],
  ['calledWithin5Pct', 'Leads called within 5 min', 'calledWithin5Pct', false, 'speedWithin5', 'pct'],
  ['contactRatePct', 'Contact rate', 'contactRatePct', false, 'contactRate', 'pct'],
  ['leadToBookedPct', 'Lead → booked call', 'leadToBookedPct', false, 'leadToBooked', 'pct'],
  ['bookedToShowPct', 'Booked call → show', 'bookedToShowPct', false, 'bookedToShow', 'pct'],
  ['leadToShowPct', 'Lead → show', 'leadToShowPct', false, 'leadToShow', 'pct'],
  ['contactToQuotePct', 'Contact → quote', 'contactToQuotePct', false, 'contactToQuote', 'pct'],
  ['quoteToContractPct', 'Quote → contract', 'quoteToContractPct', false, 'quoteToContract', 'pct'],
  ['quoteToClosePct', 'Quote → close', 'quoteToClosePct', false, 'quoteToClose', 'pct'],
  ['missedCallPct', 'Missed call rate', 'missedCallPct', true, 'missedRate', 'pct'],
];
const ACTIONS = {
  speedToLeadAvgMin: 'Call every new lead within 5 minutes; make sure Lisa gets an instant alert for each one.',
  calledWithin5Pct: 'Call every new lead within 5 minutes; make sure Lisa gets an instant alert for each one.',
  contactRatePct: 'Work the “Not attempted yet” and “Missed call” leads first; open Contact rate to see who.',
  missedCallPct: 'Call back every missed call within 15 minutes and keep the missed-call text-back on.',
  leadToBookedPct: 'Ask for the consult call on the first conversation; every contacted lead should leave with a booking.',
  bookedToShowPct: 'Confirm each booked call by text the day before and again 1 hour before.',
  leadToShowPct: 'Confirm each booked call by text the day before and again 1 hour before.',
  contactToQuotePct: 'Get quotes out faster after site visits; aim for within 48 hours of Scott’s visit.',
  quoteToContractPct: 'Follow up on every open quote within 48 hours and again at day 5.',
  quoteToClosePct: 'Follow up on every open quote within 48 hours and again at day 5.',
};
const STEP_ACTION = {
  Contacted: 'contactRatePct', Qualified: 'leadToBookedPct', Quotes: 'contactToQuotePct', 'Under contract': 'quoteToContractPct', Closed: 'quoteToClosePct',
};
function execSummary() {
  const t = pub.targets, can = !!(records || pub.detailsAvailable);
  const link = (text, drill) => can && drill ? `<a class="lnk" href="#" role="button" data-drill="${esc(drill)}">${text}</a>` : text;
  const v = (k, u) => u === 'min' ? `${cur[k]} min` : `${cur[k]}%`;
  const g = (k, u, low) => (low ? '≤ ' : '') + (u === 'min' ? `${t[k]} min` : `${t[k]}%`);
  const n = cur.totalLeads;
  const good = [], bad = [];
  const scored = GOALS.filter(([k, , gk]) => cur[k] !== null && cur[k] !== undefined && t[gk] !== undefined).map(([k, name, gk, low, drill, u]) => {
    const goal = t[gk], val = cur[k];
    const gap = low ? (goal - val) / Math.max(goal, 1) : (val - goal) / Math.max(goal, 1);   // + = beating goal
    return { k, name, gk, low, drill, u, gap };
  });
  // what's going well: best margins over goal
  for (const m of scored.filter(m => m.gap >= 0).sort((a, b) => b.gap - a.gap).slice(0, 2)) {
    const extra = m.k === 'contactRatePct' ? ` (${cur.contacted} of ${n} leads)` : '';
    good.push(link(`${m.name} is ${v(m.k, m.u)}${extra}, ${m.gap > 0.15 ? 'well ahead of' : 'meeting'} the ${g(m.gk, m.u, m.low)} goal.`, m.drill));
  }
  // positive momentum if there's room
  if (good.length < 2 && prev.totalLeads > 0 && n > prev.totalLeads) {
    const up = Math.round(((n - prev.totalLeads) / prev.totalLeads) * 100);
    if (up >= 15) good.push(link(`Lead flow is up ${up}% vs the prior period (${n} vs ${prev.totalLeads}).`, 'newLeads'));
  }
  if (good.length < 2 && cur.closedDeals > 0) good.push(link(`${cur.closedDeals} deal${cur.closedDeals > 1 ? 's' : ''} closed for ${fmt.usd(cur.revenue)}.`, 'won'));
  // needs attention: biggest misses
  const misses = scored.filter(m => m.gap < 0).sort((a, b) => a.gap - b.gap);
  const seenAction = new Set();
  for (const m of misses) {
    if (bad.length >= 3) break;
    const act = ACTIONS[m.k];
    if (seenAction.has(act) && bad.length >= 2) continue;          // don't spend all 3 bullets on one problem
    seenAction.add(act);
    bad.push(link(`${m.name} is ${v(m.k, m.u)} vs the ${g(m.gk, m.u, m.low)} goal.`, m.drill));
  }
  if (bad.length < 3 && prev.totalLeads >= 5 && n < prev.totalLeads * 0.8)
    bad.push(link(`Lead flow is down ${Math.round(((prev.totalLeads - n) / prev.totalLeads) * 100)}% vs the prior period (${n} vs ${prev.totalLeads}).`, 'newLeads'));
  // biggest funnel drop-off
  let leak = null;
  for (let i = 1; i < cur.funnel.length; i++) {
    const [name, cnt, drill] = cur.funnel[i], [pname, pcnt] = cur.funnel[i - 1];
    if (pcnt < 3) continue;                                         // too few to judge
    const lost = pcnt - cnt, rate = cnt / pcnt;
    if (!leak || lost > leak.lost || (lost === leak.lost && rate < leak.rate)) leak = { name, pname, cnt, pcnt, lost, rate, drill };
  }
  // focus: fix the biggest miss first, then the leak
  const focus = [];
  if (misses[0]) focus.push(ACTIONS[misses[0].k]);
  if (leak) { const a = ACTIONS[STEP_ACTION[leak.name]]; if (a && !focus.includes(a)) focus.push(a); }
  if (!focus.length) focus.push('Every goal is on track. Keep the same follow-up rhythm and watch lead volume.');
  const small = n > 0 && n < 5 ? `<span class="muted">· only ${n} lead${n > 1 ? 's' : ''} in these dates, so read the % with care</span>` : '';
  const li = arr => arr.length ? `<ul>${arr.map(x => `<li>${x}</li>`).join('')}</ul>` : '<div class="none">Nothing to flag.</div>';
  const leakLine = leak && leak.lost > 0
    ? `<li>${link(`Biggest drop-off: ${leak.pname} → ${leak.name}. Only ${leak.cnt} of ${leak.pcnt} moved on (${Math.round(leak.rate * 100)}%).`, leak.drill)}</li>` : '';
  $('exec').innerHTML = n === 0
    ? `<h2>Executive summary <span class="muted">· ${esc(range.label)}</span></h2><div class="none">No new leads in these dates yet.</div>`
    : `<h2>Executive summary <span class="muted">· ${esc(range.label)}</span>${small}</h2>
      <div class="exec-cols">
        <div><h4><span class="dot good"></span>What's going well</h4>${li(good)}</div>
        <div><h4><span class="dot bad"></span>Needs attention</h4>${bad.length || leakLine ? `<ul>${bad.map(x => `<li>${x}</li>`).join('')}${leakLine}</ul>` : '<div class="none">Nothing below goal.</div>'}</div>
        <div><h4><span class="dot focus"></span>Recommended focus</h4>${li(focus.slice(0, 2).map(esc))}</div>
      </div>`;
}

// ---------- drill-down modal ----------
let view = null; // { def, rows, q, filters, sortKey, sortDir, page }
const PAGE = 25;
function openDrill(key) {
  if (!records && !(window.__VOICE_PREVIEW__ && key.startsWith('ai'))) { openUnlock(key); return; }
  let def, rows;
  if (key.startsWith('source:')) {
    const src = key.slice(7);
    def = { ...DRILLS.newLeads, title: `Leads from ${src}`, def: `New leads in the selected dates with source "${src}".` };
    rows = lists.newLeads.filter(l => (l.source || 'Unknown') === src);
  } else {
    def = DRILLS[key];
    rows = def.list(lists);
  }
  if (def.prep) rows = rows.map(def.prep);
  view = { key, def, rows, q: '', filters: {}, sortKey: null, sortDir: 1, page: 0 };
  renderModal();
  $('scrim').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() { $('scrim').classList.remove('open'); document.body.style.overflow = ''; view = null; }

function cell(c, r) {
  const v = r[c.key];
  switch (c.type) {
    case 'name': { const u = ghlContact(r.contactId); return u ? `<a href="${u}" target="_blank" rel="noopener" title="Open in GoHighLevel">${esc(v || 'Unnamed')} ↗</a>` : esc(v || 'Unnamed'); }
    case 'email': return v ? `<a href="mailto:${esc(v)}">${esc(v)}</a>` : '<span class="muted">—</span>';
    case 'phone': return v ? `<a href="tel:${esc(v)}">${esc(v)}</a>` : '<span class="muted">—</span>';
    case 'dt': return v ? esc(fmt.dt(v)) : '<span class="muted">—</span>';
    case 'usd': return fmt.usd(v);
    case 'dur': return esc(fmt.dur(v));
    case 'user': return esc(userName(v));
    case 'cap': return esc(cap(v));
    case 'stl': return v === null || v === undefined ? '<span class="chip warn">Not called yet</span>' : `<span class="chip ${v <= 5 ? 'good' : 'bad'}">${v} min</span>`;
    case 'badge': {
      const s = String(v ?? '—'); const l = s.toLowerCase();
      const cls = /not tracked/.test(l) ? 'none' : /success|replied|showed|yes|won|signed|confirmed|answered/.test(l) ? 'good' : /missed|no.?show|not yet|cancel|lost|not attempted/.test(l) ? 'bad' : /attempt|sent|booked|open/.test(l) ? 'warn' : 'none';
      return `<span class="chip ${cls}">${esc(cap(s))}</span>`;
    }
    default: return v === null || v === undefined || v === '' ? '<span class="muted">—</span>' : esc(v);
  }
}
const sortVal = (c, r) => { const v = r[c.key]; if (c.type === 'dt') return v ? Date.parse(v) : -Infinity; if (c.type === 'usd' || c.num) return v ?? Infinity; if (c.type === 'user') return userName(v).toLowerCase(); return String(v ?? '').toLowerCase(); };
const filterVal = (c, r) => c.type === 'user' ? userName(r[c.key]) : String(r[c.key] ?? '—');

function filteredRows() {
  const { def, rows, q, filters, sortKey, sortDir } = view;
  let out = rows;
  if (q) { const s = q.toLowerCase(); out = out.filter(r => [r.name, r.email, r.phone, r.source, r.stage].some(x => String(x ?? '').toLowerCase().includes(s))); }
  for (const [k, val] of Object.entries(filters)) if (val) { const c = def.cols.find(c => (c.filter || c.key) === k || c.key === k); out = out.filter(r => filterVal(c, r) === val); }
  if (sortKey) { const c = def.cols.find(c => c.key === sortKey); out = [...out].sort((a, b) => { const x = sortVal(c, a), y = sortVal(c, b); return (x > y ? 1 : x < y ? -1 : 0) * sortDir; }); }
  return out;
}

function renderModal() {
  const { def, rows } = view;
  const all = rows.length;
  const shown = filteredRows();
  const pages = Math.max(1, Math.ceil(shown.length / PAGE));
  view.page = Math.min(view.page, pages - 1);
  const pageRows = shown.slice(view.page * PAGE, view.page * PAGE + PAGE);
  // summary: count always equals the tile because both come from the same list
  const unit = all === 1 ? def.unit.replace(/s$/, '').replace(/(missed call)s?$/, '$1') : def.unit;
  let sum = `<span><b>${all.toLocaleString()}</b> ${unit}</span>`;
  if (def.numerator) sum = `<span><b>${def.numerator(lists).toLocaleString()}</b> of <b>${all.toLocaleString()}</b> ${unit} ${def.numLabel}</span>`;
  if (def.denom) sum += `<span>out of <b>${def.denom(lists).toLocaleString()}</b> ${def.denomLabel}</span>`;
  if (def.total) sum += `<span>Total <b>${fmt.usd(rows.reduce((t, r) => t + (Number(r.value) || 0), 0))}</b></span>`;
  if (def.unit !== 'leads') { const u = new Set(rows.map(r => r.contactId || r.phone).filter(Boolean)).size; if (u !== all && def.unit !== 'quotes' && def.unit !== 'deals') sum += `<span class="muted">${u} unique people</span>`; }
  // filters available from the columns
  const fcols = def.cols.filter(c => c.filter);
  const selects = fcols.map(c => {
    const k = c.filter;
    const opts = [...new Set(rows.map(r => filterVal(c, r)))].sort();
    if (opts.length < 2) return '';
    return `<select data-filter="${esc(k)}" aria-label="Filter by ${esc(c.label)}"><option value="">${esc(c.label)}: all</option>${opts.map(o => `<option ${view.filters[k] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  }).join('');
  const head = def.cols.map(c => {
    const s = view.sortKey === c.key;
    return `<th class="${c.type === 'usd' || c.num ? 'num' : ''}" data-sort="${c.key}" ${s ? `aria-sort="${view.sortDir > 0 ? 'ascending' : 'descending'}"` : ''}>${esc(c.label)}<span class="arr">${s ? (view.sortDir > 0 ? '▲' : '▼') : '↕'}</span></th>`;
  }).join('');
  const body = pageRows.length
    ? pageRows.map(r => `<tr>${def.cols.map(c => `<td class="${c.type === 'usd' || c.num ? 'num' : ''}">${cell(c, r)}</td>`).join('')}</tr>`).join('')
    : `<tr><td class="empty" colspan="${def.cols.length}">${all ? 'No rows match these filters.' : 'Nothing in these dates.'}</td></tr>`;
  $('modal').className = 'modal';
  $('modal').innerHTML = `
    <div class="mhead"><div><h3 id="mTitle">${esc(def.title)} · ${esc(range.label)}</h3><div class="def">${esc(def.def)}</div></div>
      <button class="close" data-close aria-label="Close">×</button></div>
    <div class="summary">${sum}</div>
    <div class="toolbar">
      <input type="search" id="mSearch" placeholder="Search name, email, phone, source…" value="${esc(view.q)}" aria-label="Search">
      ${selects}
      <button class="btn" id="mCsv">Download CSV</button>
    </div>
    <div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="pager"><span>${shown.length === all ? `${all} rows` : `${shown.length} of ${all} rows match`}${def.foot ? ` · ${esc(def.foot)}` : ''}</span>
      <span>${pages > 1 ? `<button class="btn" data-page="-1" ${view.page === 0 ? 'disabled' : ''}>‹ Prev</button> Page ${view.page + 1} of ${pages} <button class="btn" data-page="1" ${view.page >= pages - 1 ? 'disabled' : ''}>Next ›</button>` : ''}</span></div>`;
  const s = $('mSearch');
  s.addEventListener('input', () => { if (!view) return; view.q = s.value; view.page = 0; const pos = s.selectionStart; renderModal(); const n = $('mSearch'); n.focus(); n.setSelectionRange(pos, pos); });
}

function csv() {
  const { def } = view;
  const rows = filteredRows();
  const plain = (c, r) => { const v = r[c.key]; if (c.type === 'dt') return v ? fmt.dt(v) : ''; if (c.type === 'user') return userName(v); return v ?? ''; };
  const lines = [def.cols.map(c => c.label), ...rows.map(r => def.cols.map(c => plain(c, r)))]
    .map(l => l.map(x => `"${String(x).replace(/"/g, '""')}"`).join(','));
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `${def.title.replace(/\W+/g, '-').toLowerCase()}-${range.label.replace(/\W+/g, '-').toLowerCase()}.csv` });
  a.click(); URL.revokeObjectURL(a.href);
}

// ---------- unlock ----------
let afterUnlock = null;
function openUnlock(then) {
  afterUnlock = then || null;
  $('modal').className = 'modal small';
  $('modal').innerHTML = `
    <div class="mhead"><div><h3 id="mTitle">Unlock contact details</h3>
      <div class="def">Names, emails and phones are encrypted. Enter the team passphrase to see who's behind each number.</div></div>
      <button class="close" data-close aria-label="Close">×</button></div>
    <form id="unlockForm">
      <div class="pwfield"><input type="password" id="pw" autocomplete="current-password" placeholder="Team passphrase" required></div>
      <label class="hint"><input type="checkbox" id="remember" checked> Remember on this device</label>
      <div class="status-line" id="pwMsg"></div>
      <button class="btn primary" type="submit">Unlock</button>

  $('scrim').classList.add('open');

  $('unlockForm').addEventListener('submit', async e => {

}

function renderPresets() {
  $('presets').innerHTML = PRESETS.map(([k, l]) => { const dis = !records && !pub.periods[k]; return `<button type="button" data-preset="${k}" aria-pressed="${sel.key === k}" ${dis ? 'disabled title="Unlock names to use this range"' : ''}>${l}${dis ? ' 🔒' : ''}</button>`; }).join('');
  const max = new Date((records || pub).generatedAt).toLocaleDateString('en-CA', { timeZone: TZ() });
  const min = new Date(Date.parse((records || pub).generatedAt) - (cfg.lookbackDays - 1) * 864e5).toLocaleDateString('en-CA', { timeZone: TZ() });
  for (const id of ['fromDate', 'toDate']) { $(id).max = max; $(id).min = min; $(id).disabled = !records; }
  if (sel.key === 'custom') { $('fromDate').value = sel.from; $('toDate').value = sel.to; }

function setRange(next) { sel = next; cmp.b = null; compute(); render(); $('rangePop').classList.remove('open'); $('rangeBtn').setAttribute('aria-expanded', 'false'); }
function closeCmp() { $('cmpPop').classList.remove('open'); $('cmpBtn').setAttribute('aria-expanded', 'false'); }
function applyCompare(next) { Object.assign(cmp, next); compute(); render(); }

// ---------- refresh ----------
async function refresh() {
  const btn = $('refreshBtn'), icon = $('refreshIcon');
  btn.disabled = true; icon.classList.add('spin');
  const before = (records || pub).generatedAt;
  const say = t => { $('statusLine').textContent = t; };
  try {
    const r = records?.refresh;
    if (r?.token) {
      const res = await fetch(`https://api.github.com/repos/${r.repo}/actions/workflows/${r.workflow}/dispatches`, {
        method: 'POST', headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${r.token}` }, body: JSON.stringify({ ref: 'main' }) });
      if (res.status !== 204) throw new Error(`GitHub said ${res.status}`);
      say('Pulling fresh data from GoHighLevel… this usually takes 1–2 minutes. You can keep using the dashboard.');
      for (let i = 0; i < 24; i++) {
        await new Promise(s => setTimeout(s, 10000));
        const p = await getJSON('../data/kpis.json');
        if (p.generatedAt !== before) { await reloadAll(); say('Updated with the latest GoHighLevel data.'); return; }
      }
      say('Still running. The page will pick up the new data on its own when it lands.');
    } else {
      await reloadAll();
      say((records || pub).generatedAt !== before ? 'Loaded newer data.' : 'You already have the newest data. It syncs every 30 minutes' + (records ? '' : '; unlock to trigger a sync now') + '.');
    }
  } catch (e) { say(`Refresh failed: ${e.message}`); }
  finally { btn.disabled = false; icon.classList.remove('spin'); }
}
async function reloadAll() {
  await loadPublic();
  const pass = store.get('kpi-pass');
  if (records && pass) { try { await unlock(pass, true); } catch {} }
  compute(); render();
  if (view) openDrill(view.key);
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target;
  const drill = t.closest('[data-drill]'); if (drill) { e.preventDefault(); openDrill(drill.dataset.drill); return; }
  if (t.closest('[data-close]') || t === $('scrim')) { closeModal(); return; }
  const th = t.closest('th[data-sort]'); if (th && view) { const k = th.dataset.sort; view.sortDir = view.sortKey === k ? -view.sortDir : (/(at|At|value|Min|stl)$/.test(k) ? -1 : 1); view.sortKey = k; renderModal(); return; }
  const pg = t.closest('[data-page]'); if (pg && view) { view.page += Number(pg.dataset.page); renderModal(); return; }
  if (t.closest('#mCsv')) { csv(); return; }
  const pr = t.closest('[data-preset]'); if (pr) { if (!pr.disabled) setRange({ key: pr.dataset.preset }); return; }
  if (t.closest('[data-cmp-off]')) { applyCompare({ on: false, b: null }); return; }
  const cp = t.closest('[data-cmp]');
  if (cp) {
    if (cp.disabled) return;
    const k = cp.dataset.cmp;
    if (k === 'custom') sel = { key: 'custom', from: isoDay(range.from), to: isoDay(range.to - 1) };
    else sel = { key: k };
    applyCompare({ on: true, b: null }); closeCmp(); return;
  }
  if (t.closest('#cmpBtn')) { $('rangePop').classList.remove('open'); const o = $('cmpPop').classList.toggle('open'); $('cmpBtn').setAttribute('aria-expanded', String(o)); return; }
  if (!t.closest('#cmpPop')) closeCmp();
  if (t.closest('#rangeBtn')) { closeCmp(); const o = $('rangePop').classList.toggle('open'); $('rangeBtn').setAttribute('aria-expanded', String(o)); return; }
  if (!t.closest('#rangePop')) { $('rangePop').classList.remove('open'); $('rangeBtn').setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('change', e => { const s = e.target.closest('select[data-filter]'); if (s && view) { view.filters[s.dataset.filter] = s.value; view.page = 0; renderModal(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('rangePop').classList.remove('open'); closeCmp(); } });
$('cmpOn').addEventListener('change', e => applyCompare({ on: e.target.checked }));
$('cmpMatch').addEventListener('change', e => applyCompare({ match: e.target.checked }));
$('cmpApply').addEventListener('click', () => {
  const a = [$('cmpAFrom').value, $('cmpATo').value], b = [$('cmpBFrom').value, $('cmpBTo').value];
  if (!a[0] || !a[1]) { $('cmpHint').textContent = 'Pick both dates for Period A.'; return; }
  if ((b[0] && !b[1]) || (!b[0] && b[1])) { $('cmpHint').textContent = 'Pick both dates for Period B, or leave both empty.'; return; }
  a.sort(); b.sort();
  sel = { key: 'custom', from: a[0], to: a[1] };
  applyCompare({ on: true, b: b[0] ? { from: b[0], to: b[1] } : null }); closeCmp();
});
document.addEventListener('change', e => { if (e.target.id === 'trendKpi') { trendKey = e.target.value; store.set('pv-kpi-trend', trendKey); drawTrend(); } });
let rsz; addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if (trendData) drawTrend(); }, 150); });
$('applyCustom').addEventListener('click', () => {
  const f = $('fromDate').value, t = $('toDate').value;
  if (!f || !t) return;
  setRange(f <= t ? { key: 'custom', from: f, to: t } : { key: 'custom', from: t, to: f });
});
$('refreshBtn').addEventListener('click', refresh);
$('lockBtn').addEventListener('click', () => (records ? lock() : openUnlock(null)));
const tip = $('tip');
document.addEventListener('mousemove', e => {
  const el = e.target.closest('[data-tip]');
  if (!el) { tip.style.opacity = 0; return; }
  tip.textContent = el.dataset.tip;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 290) + 'px';
  tip.style.top = e.clientY + 14 + 'px';
  tip.style.opacity = 1;
});

// ---------- start ----------
(async () => {
  try {
    await loadPublic();
    const pass = store.get('kpi-pass');
    if (pass && pub.detailsAvailable) { try { await unlock(pass, true); } catch { store.set('kpi-pass', null); } }
    compute(); render();
  } catch (e) {
    $('app').innerHTML = `<div class="err">Couldn't load the dashboard data (${esc(e.message)}). The first sync may not have run yet.</div>`;
    $('updated').textContent = '';
  }
  // pick up new syncs automatically
  setInterval(async () => {
    try { const p = await getJSON('../data/kpis.json'); if (pub && p.generatedAt !== pub.generatedAt) await reloadAll(); } catch {}
  }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
