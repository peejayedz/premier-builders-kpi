name: Sync KPIs from GoHighLevel

on:
  schedule:
    - cron: "7,37 * * * *" # every 30 minutes (UTC)
  workflow_dispatch: {} # "Run workflow" button for an on-demand refresh

permissions:
  contents: write # lets the built-in GITHUB_TOKEN commit data/kpis.json

concurrency:
  group: sync-kpis
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull GHL and compute KPIs
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ vars.GHL_LOCATION_ID }}
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: node scripts/sync.mjs

      - name: Commit if changed
        run: |
          git config user.name "kpi-sync-bot"
          git config user.email "kpi-sync-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync KPIs $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
