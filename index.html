<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Premier Builders KPI Scorecard</title>
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff; --border: #e4e3de; --grid: #ecebe7; --hover: #f2f1ed;
    --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #75746f;
    --series: #2a78d6; --link: #1c5cab;
    --good-ink: #006300; --bad-ink: #b02a2a; --warn-ink: #8a5a00;
    --chip-good: #e6f5e6; --chip-bad: #fbeaea; --chip-warn: #fdf3dc; --chip-none: #f0efec;
    --shadow: 0 12px 40px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0d0d0d; --surface: #1a1a19; --raised: #222221; --border: #2e2e2c; --grid: #2a2a28; --hover: #262624;
      --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #9a998f;
      --series: #3987e5; --link: #86b6ef;
      --good-ink: #5fd35f; --bad-ink: #f08a8a; --warn-ink: #f5c35a;
      --chip-good: #13301a; --chip-bad: #3a1a1a; --chip-warn: #3a2e12; --chip-none: #2a2a28;
      --shadow: 0 12px 40px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --page: #0d0d0d; --surface: #1a1a19; --raised: #222221; --border: #2e2e2c; --grid: #2a2a28; --hover: #262624;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #9a998f;
    --series: #3987e5; --link: #86b6ef;
    --good-ink: #5fd35f; --bad-ink: #f08a8a; --warn-ink: #f5c35a;
    --chip-good: #13301a; --chip-bad: #3a1a1a; --chip-warn: #3a2e12; --chip-none: #2a2a28;
    --shadow: 0 12px 40px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 8px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; position: relative; }
  .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 7px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--series); border-color: var(--series); color: #fff; }
  .btn[disabled] { opacity: .6; cursor: default; }
  .btn svg { width: 15px; height: 15px; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pop { position: absolute; top: calc(100% + 6px); right: 0; z-index: 20; background: var(--raised); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; width: 300px; display: none; }
  .pop.open { display: block; }
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .presets button { text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .presets button:hover { background: var(--hover); }
  .presets button[aria-pressed="true"] { background: var(--series); color: #fff; }
  .custom { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; display: grid; gap: 8px; }
  .custom label { font-size: 12px; color: var(--ink-2); display: grid; gap: 3px; }
  .custom input { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; }
  .hint { font-size: 12px; color: var(--ink-3); }
  .status-line { font-size: 12px; color: var(--ink-2); min-height: 18px; margin: 6px 0 4px; }
  .row { margin-top: 20px; }
  .row h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin: 0 0 8px; font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px) { .tiles { grid-template-columns: 1fr; } }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 12px; min-height: 128px; display: flex; flex-direction: column; text-align: left; width: 100%; }
  button.tile { cursor: pointer; }
  button.tile:hover { border-color: var(--series); }
  button.tile:focus-visible { outline: 2px solid var(--series); outline-offset: 2px; }
  .tile .label { font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .tile .value { font-size: 34px; font-weight: 650; letter-spacing: -0.02em; margin: 6px 0 8px; font-variant-numeric: tabular-nums; }
  .tile .value.muted { color: var(--ink-3); }
  .tile .foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--ink-2); }
  .tile .view { margin-left: auto; color: var(--link); font-weight: 600; opacity: .85; }
  button.tile:hover .view { opacity: 1; text-decoration: underline; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-weight: 600; font-size: 12px; white-space: nowrap; }
  .chip.good { background: var(--chip-good); color: var(--good-ink); }
  .chip.bad { background: var(--chip-bad); color: var(--bad-ink); }
  .chip.warn { background: var(--chip-warn); color: var(--warn-ink); }
  .chip.none { background: var(--chip-none); color: var(--ink-2); font-weight: 500; }
  .panels { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; }
  @media (max-width: 900px) { .panels { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .panel h3 { margin: 0 0 12px; font-size: 14px; }
  .bars { display: grid; gap: 4px; }
  .bar { display: grid; grid-template-columns: 120px 1fr 92px; gap: 10px; align-items: center; font-size: 13px; background: none; border: 0; padding: 3px 4px; border-radius: 6px; text-align: left; width: 100%; }
  button.bar { cursor: pointer; }
  button.bar:hover { background: var(--hover); }
  .bar .name { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { height: 18px; }
  .bar .fill { height: 100%; background: var(--series); border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar .num { text-align: right; font-variant-numeric: tabular-nums; }
  .bar .num span { color: var(--ink-3); margin-left: 6px; }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; padding: 6px 9px; border-radius: 6px; opacity: 0; transition: opacity .1s; z-index: 40; max-width: 280px; }
  .notes { margin-top: 20px; font-size: 12px; color: var(--ink-3); }
  .err { background: var(--chip-bad); color: var(--bad-ink); padding: 12px 14px; border-radius: 10px; margin-top: 16px; }
  /* modal */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: none; align-items: flex-start; justify-content: center; padding: 4vh 12px; overflow: auto; }
  .scrim.open { display: flex; }
  .modal { background: var(--raised); border-radius: 14px; box-shadow: var(--shadow); width: min(1180px, 100%); padding: 18px 18px 14px; }
  .modal.small { width: min(420px, 100%); }
  .mhead { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
  .mhead h3 { margin: 0; font-size: 18px; }
  .mhead .def { color: var(--ink-2); font-size: 13px; margin-top: 4px; max-width: 760px; }
  .close { background: none; border: 0; font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink-2); padding: 2px 6px; border-radius: 6px; }
  .close:hover { background: var(--hover); }
  .summary { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 12px 0; font-size: 13px; }
  .summary b { font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .toolbar input[type=search], .toolbar select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  .toolbar input[type=search] { min-width: 220px; flex: 1 1 220px; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--surface); font-size: 12px; color: var(--ink-2); font-weight: 600; cursor: pointer; user-select: none; }
  th[aria-sort] .arr { opacity: 1; }
  th .arr { opacity: .3; margin-left: 4px; font-size: 10px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }
  tr:hover td { background: var(--hover); }
  tbody tr:last-child td { border-bottom: 0; }
  .empty { padding: 28px; text-align: center; color: var(--ink-3); }
  .pager { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; color: var(--ink-2); gap: 8px; flex-wrap: wrap; }
  .pwfield { display: grid; gap: 6px; margin: 14px 0 8px; }
  .pwfield input[type=password] { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; }
  .muted { color: var(--ink-3); }
  /* section accents: thin colored bar beside each heading, neutral hairline after it */
  :root { --sec-1: #2066bd; --sec-2: #6352c9; --sec-3: #b84a1b; --sec-4: #1b7a33; --sec-5: #0f7378; --sec-6: #8f5f00; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sec-1: #4a94ec; --sec-2: #9a8ff0; --sec-3: #ef7a45; --sec-4: #3cba62; --sec-5: #2bb5ba; --sec-6: #e5ad2e; } }
  :root[data-theme="dark"] { --sec-1: #4a94ec; --sec-2: #9a8ff0; --sec-3: #ef7a45; --sec-4: #3cba62; --sec-5: #2bb5ba; --sec-6: #e5ad2e; }
  .row { margin-top: 28px; }
  .row h2 { display: flex; align-items: center; gap: 10px; color: var(--ink); font-size: 12px; margin-bottom: 10px; }
  .row h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--sec, var(--ink-3)); flex: none; }
  .row h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, color-mix(in srgb, var(--sec, var(--border)) 45%, transparent), var(--border) 30%, transparent); }
  .row h2 .num { color: var(--sec); font-variant-numeric: tabular-nums; }
  .sec-1 { --sec: var(--sec-1); } .sec-2 { --sec: var(--sec-2); } .sec-3 { --sec: var(--sec-3); }
  .sec-4 { --sec: var(--sec-4); } .sec-5 { --sec: var(--sec-5); } .sec-6 { --sec: var(--sec-6); }
  /* executive summary */
  .exec { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .exec h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin: 0 0 10px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .exec h2 .muted { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .exec-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 900px) { .exec-cols { grid-template-columns: 1fr; gap: 10px; } }
  .exec h4 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .exec h4 .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.good { background: #0ca30c; } .dot.bad { background: #d03b3b; } .dot.focus { background: var(--series); }
  .exec ul { margin: 0; padding-left: 16px; display: grid; gap: 5px; font-size: 13px; color: var(--ink); }
  .exec li::marker { color: var(--ink-3); }
  .exec .lnk { display: inline; background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; text-align: left; font: inherit; }
  .exec .lnk:hover { text-decoration: underline; }
  .exec .none { color: var(--ink-3); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Premier Builders · Sales KPI Scorecard</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <div class="controls">
      <button class="btn" id="rangeBtn" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span id="rangeLabel">Last 7 days</span><span aria-hidden="true">▾</span>
      </button>
      <button class="btn" id="refreshBtn" title="Pull the latest numbers from GoHighLevel">
        <svg id="refreshIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        Refresh data
      </button>
      <button class="btn" id="lockBtn"></button>
      <div class="pop" id="rangePop" role="dialog" aria-label="Choose dates">
        <div class="presets" id="presets"></div>
        <div class="custom">
          <label>From <input type="date" id="fromDate"></label>
          <label>To <input type="date" id="toDate"></label>
          <button class="btn primary" id="applyCustom">Apply dates</button>
          <div class="hint" id="customHint"></div>
        </div>
      </div>
    </div>
  </header>
  <div class="status-line" id="statusLine" aria-live="polite"></div>
  <section class="exec" id="exec" aria-label="Executive summary"></section>
  <main id="app"></main>
  <div class="notes" id="notes"></div>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"></div></div>
<div class="tip" id="tip" role="tooltip"></div>

<script type="module">
import { buildLists, summarize, periodRange, customRange, tzOffsetMin, decryptJSON } from './scripts/kpi-core.mjs';

// ---------- state ----------
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
let pub = null, cfg = null, records = null;        // public aggregates, config, decrypted records
let sel = JSON.parse(store.get('kpi-range') || '{"key":"last7"}');
let lists = null, cur = null, prev = null, range = null;

const PRESETS = [['today','Today'],['yesterday','Yesterday'],['last7','Last 7 days'],['last30','Last 30 days'],['last90','Last 90 days'],['thisMonth','This month'],['lastMonth','Last month']];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

// ---------- formatting ----------
const TZ = () => cfg?.timezone || 'America/Indiana/Indianapolis';
const fmt = {
  n: v => v === null || v === undefined ? '—' : Math.round(v).toLocaleString(),
  pct: v => v === null || v === undefined ? '—' : `${v}%`,
  usd: v => v === null || v === undefined ? '—' : '$' + Math.round(v).toLocaleString(),
  min: v => v === null || v === undefined ? '—' : `${v} min`,
  dt: v => v ? new Date(v).toLocaleString('en-US', { timeZone: TZ(), month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—',
  date: v => v ? new Date(v).toLocaleDateString('en-US', { timeZone: TZ(), month: 'short', day: 'numeric', year: 'numeric' }) : '—',
};
const userName = id => (id && records?.users?.[id]) || (id ? 'Unknown user' : 'Unassigned');
const ghlContact = cid => cid && records ? `${records.ghlBase}/v2/location/${records.locationId}/contacts/detail/${cid}` : null;
const cap = s => s ? String(s).charAt(0).toUpperCase() + String(s).slice(1) : '—';

// ---------- data loading ----------
async function getJSON(path) {
  const r = await fetch(`${path}?t=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.json();
}
async function loadPublic() {
  [pub, cfg] = await Promise.all([getJSON('data/kpis.json'), getJSON('config.json')]);
}
async function unlock(pass, remember) {
  const env = await getJSON('data/details.enc.json');
  records = await decryptJSON(env, pass);          // throws on a wrong passphrase
  if (remember) store.set('kpi-pass', pass);
}
function lock() { records = null; store.set('kpi-pass', null); compute(); render(); }

// ---------- compute (numbers ALWAYS come from the same lists the tables show) ----------
function compute() {
  const now = Date.parse((records || pub).generatedAt);
  const off = tzOffsetMin(TZ(), now);
  if (sel.key === 'custom' && !records) sel = { key: 'last7' };
  if (!records && !pub.periods[sel.key]) sel = { key: 'last7' };
  range = sel.key === 'custom' ? customRange(sel.from, sel.to, now, off) : periodRange(sel.key, now, off);
  if (records) {
    lists = buildLists(records, cfg, range.from, range.to);
    cur = summarize(lists);
    prev = summarize(buildLists(records, cfg, range.prevFrom, range.prevTo));
  } else {
    lists = null;
    cur = pub.periods[sel.key].current;
    prev = pub.periods[sel.key].previous;
  }
  store.set('kpi-range', JSON.stringify(sel));
}

// ---------- drill-down definitions ----------
const col = {
  name: { label: 'Name', key: 'name', type: 'name' },
  email: { label: 'Email', key: 'email', type: 'email' },
  phone: { label: 'Phone', key: 'phone', type: 'phone' },
  source: { label: 'Lead source', key: 'source', filter: 'source' },
  created: { label: 'Created', key: 'createdAt', type: 'dt' },
  assigned: { label: 'Assigned to', key: 'assignedTo', type: 'user', filter: 'user' },
  stage: { label: 'Pipeline stage', key: 'stage' },
  status: { label: 'Status', key: 'status', type: 'cap', filter: 'status' },
  value: { label: 'Amount', key: 'value', type: 'usd' },
};
const DRILLS = {
  newLeads: { title: 'New leads', unit: 'leads', list: L => L.newLeads,
    def: 'Every opportunity created in the selected dates, in both pipelines.',
    cols: [col.name, col.email, col.phone, col.source, col.created, col.assigned, col.stage, { label: 'Contact status', key: 'contactStatus', type: 'badge', filter: 'contactStatus' }, { ...col.status, label: 'Deal status' }] },
  contacted: { title: 'Contacted leads', unit: 'leads', list: L => L.contacted,
    def: 'New leads in the selected dates with a two-way contact: a reply, a connected call, or a booking (or they already reached a later stage).',
    cols: [col.name, col.email, col.phone, { label: 'Contacted at', key: 'firstContactedAt', type: 'dt' }, { label: 'Method', key: 'contactMethod' }, col.assigned, { label: 'Response', key: 'contactStatus', type: 'badge', filter: 'contactStatus' }] },
  contactRate: { title: 'Contact rate', unit: 'leads', list: L => L.newLeads, numerator: L => L.contacted.length, numLabel: 'contacted',
    def: 'All new leads, with how far contact got. Filter by Contact status to see who still needs a call.',
    cols: [col.name, col.email, col.phone, col.created, { label: 'Contact status', key: 'contactStatus', type: 'badge', filter: 'contactStatus' }, { label: 'Method', key: 'contactMethod' }, col.assigned] },
  speed: { title: 'Speed to lead', unit: 'leads', list: L => L.speed,
    def: 'Business-hours minutes (Mon–Sat 8am–6pm) from lead created to the first outbound call. Slowest first; leads nobody has called yet are at the top.',
    cols: [col.name, col.created, { label: 'First response', key: '_firstResponse', type: 'dt' }, { label: 'Speed to lead', key: 'stlMin', type: 'stl', num: true }, { label: 'Method', key: 'contactMethod' }, col.assigned, col.phone],
    prep: r => ({ ...r, _firstResponse: r.firstCallAt || (r.stlMin === null || r.stlMin === undefined ? null : new Date(Date.parse(r.createdAt) + r.stlMin * 60000).toISOString()) }) },
  qualified: { title: 'Qualified leads', unit: 'leads', list: L => L.qualified,
    def: 'New leads Lisa marked Qualified (Status overlay), plus any lead that reached Sent Quote or later (or Won). Leads she marked Not Qualified are excluded.',
    cols: [col.name, col.email, col.phone, { label: 'Qualification', key: '_qual', type: 'badge' }, col.source, col.assigned, { label: 'Date qualified*', key: 'stageChangedAt', type: 'dt' }, col.stage],
    prep: r => ({ ...r, _qual: r.qualifiedBy || '—' }),
    foot: '* Date the card entered its current stage. GHL keeps no history of earlier stage dates.' },
  booked: { title: 'Booked calls', unit: 'appointments', list: L => L.booked,
    def: 'Any appointment with Lisa (her calendars or assigned to her) starting in the selected dates, excluding cancelled and invalid. One row per appointment.',
    cols: [col.name, col.email, col.phone, { label: 'Appointment', key: 'startTime', type: 'dt' }, { label: 'Type', key: 'calendar', filter: 'calendar' }, col.assigned, { label: 'Booked on', key: 'bookedAt', type: 'dt' }, { label: 'Status', key: 'status', type: 'badge', filter: 'status' }] },
  showed: { title: 'Showed calls', unit: 'appointments', list: L => L.showed,
    def: 'Booked calls in the selected dates marked Showed in the calendar.',
    cols: [col.name, col.email, col.phone, { label: 'Appointment', key: 'startTime', type: 'dt' }, col.assigned, { label: 'Outcome', key: 'status', type: 'badge' }] },
  quotes: { title: 'Quotes sent', unit: 'quotes', list: L => L.quotes, total: true,
    def: 'New leads in the selected dates that reached Quote Sent or later, whatever happened after.',

const ACTIONS = {
  speedToLeadAvgMin: 'Call every new lead within 5 minutes; make sure Lisa gets an instant alert for each one.',
  calledWithin5Pct: 'Call every new lead within 5 minutes; make sure Lisa gets an instant alert for each one.',
  contactRatePct: 'Work the “Not attempted yet” and “Missed call” leads first; open Contact rate to see who.',

const STEP_ACTION = {
  Contacted: 'contactRatePct', Qualified: 'leadToBookedPct', Quotes: 'contactToQuotePct', 'Under contract': 'quoteToContractPct', Closed: 'quoteToClosePct',
};
function execSummary() {
  const t = pub.targets, can = !!(records || pub.detailsAvailable);
  const link = (text, drill) => can && drill ? `<a class="lnk" href="#" role="button" data-drill="${esc(drill)}">${text}</a>` : text;
  const v = (k, u) => u === 'min' ? `${cur[k]} min` : `${cur[k]}%`;
  const g = (k, u, low) => (low ? '≤ ' : '') + (u === 'min' ? `${t[k]} min` : `${t[k]}%`);
  const n = cur.totalLeads;
  const good = [], bad = [];
  const scored = GOALS.filter(([k, , gk]) => cur[k] !== null && cur[k] !== undefined && t[gk] !== undefined).map(([k, name, gk, low, drill, u]) => {
    const goal = t[gk], val = cur[k];
    const gap = low ? (goal - val) / Math.max(goal, 1) : (val - goal) / Math.max(goal, 1);   // + = beating goal
    return { k, name, gk, low, drill, u, gap };
  });
  // what's going well: best margins over goal
  for (const m of scored.filter(m => m.gap >= 0).sort((a, b) => b.gap - a.gap).slice(0, 2)) {
    const extra = m.k === 'contactRatePct' ? ` (${cur.contacted} of ${n} leads)` : '';
    good.push(link(`${m.name} is ${v(m.k, m.u)}${extra}, ${m.gap > 0.15 ? 'well ahead of' : 'meeting'} the ${g(m.gk, m.u, m.low)} goal.`, m.drill));
  }
  // positive momentum if there's room
  if (good.length < 2 && prev.totalLeads > 0 && n > prev.totalLeads) {
    const up = Math.round(((n - prev.totalLeads) / prev.totalLeads) * 100);
    if (up >= 15) good.push(link(`Lead flow is up ${up}% vs the prior period (${n} vs ${prev.totalLeads}).`, 'newLeads'));
  }
  if (good.length < 2 && cur.closedDeals > 0) good.push(link(`${cur.closedDeals} deal${cur.closedDeals > 1 ? 's' : ''} closed for ${fmt.usd(cur.revenue)}.`, 'won'));
  // needs attention: biggest misses
  const misses = scored.filter(m => m.gap < 0).sort((a, b) => a.gap - b.gap);
  const seenAction = new Set();
  for (const m of misses) {
    if (bad.length >= 3) break;
    const act = ACTIONS[m.k];
    if (seenAction.has(act) && bad.length >= 2) continue;          // don't spend all 3 bullets on one problem
    seenAction.add(act);
    bad.push(link(`${m.name} is ${v(m.k, m.u)} vs the ${g(m.gk, m.u, m.low)} goal.`, m.drill));
  }
  if (bad.length < 3 && prev.totalLeads >= 5 && n < prev.totalLeads * 0.8)
    bad.push(link(`Lead flow is down ${Math.round(((prev.totalLeads - n) / prev.totalLeads) * 100)}% vs the prior period (${n} vs ${prev.totalLeads}).`, 'newLeads'));
  // biggest funnel drop-off
  let leak = null;
  for (let i = 1; i < cur.funnel.length; i++) {
    const [name, cnt, drill] = cur.funnel[i], [pname, pcnt] = cur.funnel[i - 1];
    if (pcnt < 3) continue;                                         // too few to judge
    const lost = pcnt - cnt, rate = cnt / pcnt;
    if (!leak || lost > leak.lost || (lost === leak.lost && rate < leak.rate)) leak = { name, pname, cnt, pcnt, lost, rate, drill };
  }
  // focus: fix the biggest miss first, then the leak
  const focus = [];
  if (misses[0]) focus.push(ACTIONS[misses[0].k]);
  if (leak) { const a = ACTIONS[STEP_ACTION[leak.name]]; if (a && !focus.includes(a)) focus.push(a); }
  if (!focus.length) focus.push('Every goal is on track. Keep the same follow-up rhythm and watch lead volume.');
  const small = n > 0 && n < 5 ? `<span class="muted">· only ${n} lead${n > 1 ? 's' : ''} in these dates, so read the % with care</span>` : '';
  const li = arr => arr.length ? `<ul>${arr.map(x => `<li>${x}</li>`).join('')}</ul>` : '<div class="none">Nothing to flag.</div>';
  const leakLine = leak && leak.lost > 0
    ? `<li>${link(`Biggest drop-off: ${leak.pname} → ${leak.name}. Only ${leak.cnt} of ${leak.pcnt} moved on (${Math.round(leak.rate * 100)}%).`, leak.drill)}</li>` : '';
  $('exec').innerHTML = n === 0
    ? `<h2>Executive summary <span class="muted">· ${esc(range.label)}</span></h2><div class="none">No new leads in these dates yet.</div>`
    : `<h2>Executive summary <span class="muted">· ${esc(range.label)}</span>${small}</h2>
      <div class="exec-cols">
        <div><h4><span class="dot good"></span>What's going well</h4>${li(good)}</div>
        <div><h4><span class="dot bad"></span>Needs attention</h4>${bad.length || leakLine ? `<ul>${bad.map(x => `<li>${x}</li>`).join('')}${leakLine}</ul>` : '<div class="none">Nothing below goal.</div>'}</div>
        <div><h4><span class="dot focus"></span>Recommended focus</h4>${li(focus.slice(0, 2).map(esc))}</div>
      </div>`;
}

    </div>
    <div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="pager"><span>${shown.length === all ? `${all} rows` : `${shown.length} of ${all} rows match`}${def.foot ? ` · ${esc(def.foot)}` : ''}</span>
      <span>${pages > 1 ? `<button class="btn" data-page="-1" ${view.page === 0 ? 'disabled' : ''}>‹ Prev</button> Page ${view.page + 1} of ${pages} <button class="btn" data-page="1" ${view.page >= pages - 1 ? 'disabled' : ''}>Next ›</button>` : ''}</span></div>`;
  const s = $('mSearch');
  s.addEventListener('input', () => { if (!view) return; view.q = s.value; view.page = 0; const pos = s.selectionStart; renderModal(); const n = $('mSearch'); n.focus(); n.setSelectionRange(pos, pos); });
}

function csv() {
  const { def } = view;
  const rows = filteredRows();
  const plain = (c, r) => { const v = r[c.key]; if (c.type === 'dt') return v ? fmt.dt(v) : ''; if (c.type === 'user') return userName(v); return v ?? ''; };
  const lines = [def.cols.map(c => c.label), ...rows.map(r => def.cols.map(c => plain(c, r)))]
    .map(l => l.map(x => `"${String(x).replace(/"/g, '""')}"`).join(','));
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `${def.title.replace(/\W+/g, '-').toLowerCase()}-${range.label.replace(/\W+/g, '-').toLowerCase()}.csv` });
  a.click(); URL.revokeObjectURL(a.href);
}

// ---------- unlock ----------
let afterUnlock = null;
function openUnlock(then) {
  afterUnlock = then || null;
  $('modal').className = 'modal small';
  $('modal').innerHTML = `
    <div class="mhead"><div><h3 id="mTitle">Unlock contact details</h3>
      <div class="def">Names, emails and phones are encrypted. Enter the team passphrase to see who's behind each number.</div></div>
      <button class="close" data-close aria-label="Close">×</button></div>
    <form id="unlockForm">
      <div class="pwfield"><input type="password" id="pw" autocomplete="current-password" placeholder="Team passphrase" required></div>
      <label class="hint"><input type="checkbox" id="remember" checked> Remember on this device</label>
      <div class="status-line" id="pwMsg"></div>
      <button class="btn primary" type="submit">Unlock</button>
    </form>`;
  $('scrim').classList.add('open');
  $('pw').focus();
  $('unlockForm').addEventListener('submit', async e => {
    e.preventDefault();
    $('pwMsg').textContent = 'Unlocking…';
    try {
      await unlock($('pw').value, $('remember').checked);
      compute(); render();
      if (afterUnlock) openDrill(afterUnlock); else closeModal();
    } catch { $('pwMsg').textContent = 'That passphrase didn’t work. Check it and try again.'; }
  });
}

// ---------- date range ----------
function renderPresets() {
  $('presets').innerHTML = PRESETS.map(([k, l]) => `<button type="button" data-preset="${k}" aria-pressed="${sel.key === k}">${l}</button>`).join('');
  const max = new Date((records || pub).generatedAt).toLocaleDateString('en-CA', { timeZone: TZ() });
  const min = new Date(Date.parse((records || pub).generatedAt) - (cfg.lookbackDays - 1) * 864e5).toLocaleDateString('en-CA', { timeZone: TZ() });
  for (const id of ['fromDate', 'toDate']) { $(id).max = max; $(id).min = min; $(id).disabled = !records; }
  if (sel.key === 'custom') { $('fromDate').value = sel.from; $('toDate').value = sel.to; }
  $('applyCustom').disabled = !records;
  $('customHint').textContent = records ? `Any dates from ${fmt.date(min + 'T12:00:00Z')} to today.` : 'Unlock to pick custom dates.';
}
function setRange(next) { sel = next; compute(); render(); $('rangePop').classList.remove('open'); $('rangeBtn').setAttribute('aria-expanded', 'false'); }

// ---------- refresh ----------
async function refresh() {
  const btn = $('refreshBtn'), icon = $('refreshIcon');
  btn.disabled = true; icon.classList.add('spin');
  const before = (records || pub).generatedAt;
  const say = t => { $('statusLine').textContent = t; };
  try {
    const r = records?.refresh;
    if (r?.token) {
      const res = await fetch(`https://api.github.com/repos/${r.repo}/actions/workflows/${r.workflow}/dispatches`, {
        method: 'POST', headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${r.token}` }, body: JSON.stringify({ ref: 'main' }) });
      if (res.status !== 204) throw new Error(`GitHub said ${res.status}`);
      say('Pulling fresh data from GoHighLevel… this usually takes 1–2 minutes. You can keep using the dashboard.');
      for (let i = 0; i < 24; i++) {
        await new Promise(s => setTimeout(s, 10000));
        const p = await getJSON('data/kpis.json');
        if (p.generatedAt !== before) { await reloadAll(); say('Updated with the latest GoHighLevel data.'); return; }
      }
      say('Still running. The page will pick up the new data on its own when it lands.');
    } else {
      await reloadAll();
      say((records || pub).generatedAt !== before ? 'Loaded newer data.' : 'You already have the newest data. It syncs every 30 minutes' + (records ? '' : '; unlock to trigger a sync now') + '.');
    }
  } catch (e) { say(`Refresh failed: ${e.message}`); }
  finally { btn.disabled = false; icon.classList.remove('spin'); }
}
async function reloadAll() {
  await loadPublic();
  const pass = store.get('kpi-pass');
  if (records && pass) { try { await unlock(pass, true); } catch {} }
  compute(); render();
  if (view) openDrill(view.key);
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target;
  const drill = t.closest('[data-drill]'); if (drill) { e.preventDefault(); openDrill(drill.dataset.drill); return; }
  if (t.closest('[data-close]') || t === $('scrim')) { closeModal(); return; }
  const th = t.closest('th[data-sort]'); if (th && view) { const k = th.dataset.sort; view.sortDir = view.sortKey === k ? -view.sortDir : (/(at|At|value|Min|stl)$/.test(k) ? -1 : 1); view.sortKey = k; renderModal(); return; }
  const pg = t.closest('[data-page]'); if (pg && view) { view.page += Number(pg.dataset.page); renderModal(); return; }
  if (t.closest('#mCsv')) { csv(); return; }
  const pr = t.closest('[data-preset]'); if (pr) { setRange({ key: pr.dataset.preset }); return; }
  if (t.closest('#rangeBtn')) { const o = $('rangePop').classList.toggle('open'); $('rangeBtn').setAttribute('aria-expanded', String(o)); return; }
  if (!t.closest('#rangePop')) { $('rangePop').classList.remove('open'); $('rangeBtn').setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('change', e => { const s = e.target.closest('select[data-filter]'); if (s && view) { view.filters[s.dataset.filter] = s.value; view.page = 0; renderModal(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('rangePop').classList.remove('open'); } });
$('applyCustom').addEventListener('click', () => {
  const f = $('fromDate').value, t = $('toDate').value;
  if (!f || !t) return;
  setRange(f <= t ? { key: 'custom', from: f, to: t } : { key: 'custom', from: t, to: f });
});
$('refreshBtn').addEventListener('click', refresh);
$('lockBtn').addEventListener('click', () => (records ? lock() : openUnlock(null)));
const tip = $('tip');
document.addEventListener('mousemove', e => {
  const el = e.target.closest('[data-tip]');
  if (!el) { tip.style.opacity = 0; return; }
  tip.textContent = el.dataset.tip;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 290) + 'px';
  tip.style.top = e.clientY + 14 + 'px';
  tip.style.opacity = 1;
});

// ---------- start ----------
(async () => {
  try {
    await loadPublic();
    const pass = store.get('kpi-pass');
    if (pass && pub.detailsAvailable) { try { await unlock(pass, true); } catch { store.set('kpi-pass', null); } }
    compute(); render();
  } catch (e) {
    $('app').innerHTML = `<div class="err">Couldn't load the dashboard data (${esc(e.message)}). The first sync may not have run yet.</div>`;
    $('updated').textContent = '';
  }
  // pick up new syncs automatically
  setInterval(async () => {
    try { const p = await getJSON('data/kpis.json'); if (pub && p.generatedAt !== pub.generatedAt) await reloadAll(); } catch {}
  }, 5 * 60 * 1000);
})();
</script>
</body>
